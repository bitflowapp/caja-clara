name: Caja Clara Native
on:
  push:
    branches: ['work/caja-clara-native-20260921', 'feat/caja-clara-integrations-v03']
    paths: ['native/**', '.github/workflows/caja-clara-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: caja-clara-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Build core and execute tests
        id: core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native/artifacts | Out-Null
          git rev-parse HEAD | Set-Content native/artifacts/source-commit.txt
          dotnet --info | Tee-Object native/artifacts/dotnet-info.txt
          dotnet build native/src/CajaClara.Core/CajaClara.Core.csproj -c Release 2>&1 | Tee-Object native/artifacts/build-core.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project native/tests/CajaClara.Tests/CajaClara.Tests.csproj -c Release -- native/artifacts 2>&1 | Tee-Object native/artifacts/tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test fiscal and payment providers
        id: integrations
        shell: pwsh
        run: |
          dotnet build native/src/CajaClara.Fiscal/CajaClara.Fiscal.csproj -c Release 2>&1 | Tee-Object native/artifacts/build-fiscal.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project native/tests/CajaClara.FiscalTests/CajaClara.FiscalTests.csproj -c Release -- native/artifacts 2>&1 | Tee-Object native/artifacts/fiscal-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build native/src/CajaClara.Payments/CajaClara.Payments.csproj -c Release 2>&1 | Tee-Object native/artifacts/build-payments.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project native/tests/CajaClara.PaymentTests/CajaClara.PaymentTests.csproj -c Release -- native/artifacts 2>&1 | Tee-Object native/artifacts/payment-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish native Windows application
        id: windows
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native/artifacts/package/app | Out-Null
          dotnet publish native/src/CajaClara.Windows/CajaClara.Windows.csproj -c Release -r win-x64 --self-contained true -o native/artifacts/package/app 2>&1 | Tee-Object native/artifacts/build-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item native/scripts/Install.ps1 native/artifacts/package/
          Copy-Item 'native/scripts/Instalar Caja Clara.cmd' native/artifacts/package/
          Copy-Item native/scripts/Uninstall.ps1 native/artifacts/package/
      - name: Build cloud, terminal and integration tests
        id: backend
        if: always()
        shell: pwsh
        run: |
          dotnet build native/src/CajaClara.Backend/CajaClara.Backend.csproj -c Release 2>&1 | Tee-Object native/artifacts/build-backend.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish native/src/CajaClara.Cli/CajaClara.Cli.csproj -c Release -r win-x64 --self-contained true -o native/artifacts/package/terminal 2>&1 | Tee-Object native/artifacts/build-cli.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project native/tests/CajaClara.CloudTests/CajaClara.CloudTests.csproj -c Release -- native/artifacts 2>&1 | Tee-Object native/artifacts/cloud-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish native/src/CajaClara.Backend/CajaClara.Backend.csproj -c Release -r win-x64 --self-contained true -o native/artifacts/package/server 2>&1 | Tee-Object native/artifacts/publish-backend.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install UI test dependencies
        id: testdeps
        if: always()
        shell: pwsh
        run: |
          python -m pip install playwright pywinauto Pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify per-user installer
        id: install
        if: always() && steps.windows.outcome == 'success'
        shell: pwsh
        run: |
          & native/tests/install_smoke.ps1 -Phase Install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run real native UI flow
        if: always() && steps.windows.outcome == 'success' && steps.install.outcome == 'success' && steps.testdeps.outcome == 'success'
        timeout-minutes: 6
        shell: pwsh
        run: |
          python native/tests/ui_smoke.py 2>&1 | Tee-Object native/artifacts/ui-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify uninstall preserves data
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: |
          & native/tests/install_smoke.ps1 -Phase Uninstall
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run mobile browser and HTTP end to end
        if: always() && steps.backend.outcome == 'success' && steps.testdeps.outcome == 'success'
        timeout-minutes: 6
        shell: pwsh
        run: |
          python native/tests/browser_e2e.py 2>&1 | Tee-Object native/artifacts/browser-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect package documentation
        if: always()
        shell: pwsh
        run: |
          Copy-Item native/README.md native/artifacts/package/LEEME.md
          Copy-Item native/docs native/artifacts/package/docs -Recurse -Force
          git rev-parse HEAD | Set-Content native/artifacts/package/source-commit.txt
          Get-ChildItem native/artifacts/package -Recurse -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.FullName.Substring((Resolve-Path native/artifacts/package).Path.Length + 1) } | Set-Content native/artifacts/package/SHA256SUMS.txt
      - name: Upload source and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CajaClara-Native-source-and-evidence
          path: |
            native/
            !native/**/obj/**
            !native/**/bin/**
            !native/artifacts/package/**
            !native/**/.data/**
          retention-days: 7
      - name: Upload Windows package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CajaClara-Native-Windows-x64
          path: native/artifacts/package/
          if-no-files-found: ignore
          retention-days: 7
